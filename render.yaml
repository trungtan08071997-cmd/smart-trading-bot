services:
  - type: web
    name: smart-trading-bot
    env: python
    buildCommand: |
      apt-get update && apt-get install -y build-essential
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: "python ai_optimizer_bot.py"
    envVars:
      PYTHON_VERSION: 3.10
      TZ: Asia/Ho_Chi_Minh
