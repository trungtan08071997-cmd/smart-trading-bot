services:
  - type: web
    name: smart-trading-bot
    env: python
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    environment:
      PYTHONUNBUFFERED: "1"
    build:
      environment:
        pythonVersion: 3.11
